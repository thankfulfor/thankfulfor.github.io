extends: existence
message: "Проверь, подтверждена ли степень уверенности в формулировке '%s'."
level: suggestion
ignorecase: true
tokens:
  - 'всегда'
  - 'никогда'
  - 'гарантированн(?:о|ый|ая|ое|ые)'
  - 'безусловно'
  - 'очевидно'
  - 'возможно'
  - 'вероятно'
  - 'скорее всего'
  - 'может быть'
tests:
  - name: отмечает категоричное утверждение
    input: Метод всегда возвращает этот объект.
    contains: thankfulfor.Confidence
  - name: пропускает утверждение с названным условием
    input: Метод возвращает объект, если снимок доступен пользователю.
    absent: thankfulfor.Confidence
