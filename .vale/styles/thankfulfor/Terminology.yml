extends: substitution
message: "Используй '%s' вместо '%s'."
level: suggestion
ignorecase: true
swap:
  'API-интерфейс': 'API'
  'JSON-формат': 'JSON'
  'веб сайт': 'веб-сайт'
  'веб страница': 'веб-страница'
tests:
  - name: отмечает избыточный термин
    input: Это API-интерфейс.
    contains: thankfulfor.Terminology
  - name: пропускает предпочтительный термин
    input: Метод описан в API.
    absent: thankfulfor.Terminology
