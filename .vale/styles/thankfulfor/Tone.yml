extends: existence
message: "Проверь, не звучит ли фраза назидательно: '%s'."
level: suggestion
ignorecase: true
tokens:
  - 'важно помнить'
  - 'следует понимать'
  - 'хороший .* должен'
  - 'главный вывод для себя'
  - 'не забудьте'
  - 'давайте (?:нажмём|перейдём|рассмотрим|разберём)'
tests:
  - name: отмечает назидательную формулировку
    input: Важно помнить об этом ограничении.
    contains: thankfulfor.Tone
  - name: пропускает нейтральную инструкцию
    input: Учитывайте это ограничение.
    absent: thankfulfor.Tone
