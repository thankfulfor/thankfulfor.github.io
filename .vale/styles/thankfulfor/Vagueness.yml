extends: existence
message: "Уточни формулировку '%s': назови объект, срок или условие."
level: suggestion
ignorecase: true
tokens:
  - 'скоро'
  - 'в ближайшее время'
  - 'некоторые (?:функции|возможности|изменения|данные)'
  - 'важная информация'
  - 'и так далее'
  - 'и тому подобное'
tests:
  - name: отмечает размытый срок
    input: Функция появится в ближайшее время.
    contains: thankfulfor.Vagueness
  - name: пропускает конкретный срок
    input: Функция появится 12 ноября 2026 года.
    absent: thankfulfor.Vagueness
