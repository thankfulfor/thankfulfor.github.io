extends: substitution
message: "Сократи формулировку: используй '%s' вместо '%s'."
level: suggestion
ignorecase: true
swap:
  'для того чтобы': 'чтобы'
  'на текущий момент': 'сейчас'
  'осуществлять проверку': 'проверять'
  'производить настройку': 'настраивать'
  'в случае если': 'если'
tests:
  - name: отмечает многословную конструкцию
    input: Для того чтобы продолжить, сохраните файл.
    contains: thankfulfor.Wordiness
  - name: пропускает краткую конструкцию
    input: Чтобы продолжить, сохраните файл.
    absent: thankfulfor.Wordiness
